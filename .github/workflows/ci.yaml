name: ci
on:
  pull_request:
    branches:
      - main
      
  push:
    branches: 
      - main
    paths-ignore:
      - 'README.md'
      - 'helm/**'
jobs:  
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: 1.22
      - name: build
        run: go build -o go-web-app
      - name: test
        run: go test ./...
        
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup-docker
        uses: docker/setup-buildx-action@v4
      - name: login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check secrets
        run: |
          echo "Username set: ${{ secrets.DOCKERHUB_USERNAME != '' }}"
          echo "Token set: ${{ secrets.DOCKERHUB_TOKEN != '' }}"
      - name: Build and Push action
        uses: docker/build-push-action@v7
        with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{github.run_id}}
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' go-web-app-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "shivarajjk7@gmail.com"
        git config --global user.name "shivaraju73"
        git add go-web-app-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
        
